name: ALLways Carrier Android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android
        shell: bash
        run: |
          flutter create --platforms=android --org com.allways --project-name carrier .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          if 'id("com.google.gms.google-services") version "4.5.0" apply false' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false',
                  1,
              )
          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
          prefix = """import java.util.Properties

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
          }

          """
          if "val keystorePropertiesFile = rootProject.file" not in s:
              s = prefix + s
          signing = """    signingConfigs {
              if (keystorePropertiesFile.exists()) {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          }

          """
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {" + chr(10) + signing, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = if (keystorePropertiesFile.exists()) { signingConfigs.getByName("release") } else { signingConfigs.getByName("debug") }')
          s = s.replace('namespace = "com.example.carrier"', 'namespace = "com.allways.carrier"')
          s = s.replace('applicationId = "com.example.carrier"', 'applicationId = "com.allways.carrier"')
          if 'namespace = "com.allways.carrier"' not in s:
              s = s.replace("android {", 'android {\n    namespace = "com.allways.carrier"', 1)
          s = s.replace('namespace = "com.example.carrier"', 'namespace = "com.allways.carrier"')
          s = s.replace('applicationId = "com.example.carrier"', 'applicationId = "com.allways.carrier"')
          if 'applicationId = "com.allways.carrier"' not in s:
              s = s.replace('applicationId = ""', 'applicationId = "com.allways.carrier"', 1)
          p.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest.parent.mkdir(parents=True, exist_ok=True)
          manifest.write_text("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
            <application android:label="ALLways Carrier Android" android:icon="@mipmap/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <receiver android:name=".MainActivity$InstallStatusReceiver" android:exported="false"/>
              <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="allways_urgent_v2"/>
              <meta-data android:name="flutterEmbedding" android:value="2"/>
            </application>
          </manifest>
          """)
          PY

          cat > android/app/src/main/kotlin/com/allways/carrier/MainActivity.kt <<'KOTLIN'
package com.allways.carrier
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.PendingIntent
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.content.pm.PackageInstaller
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.provider.Settings
import androidx.core.app.NotificationCompat
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel
import java.io.File
import java.io.FileInputStream
class MainActivity : FlutterActivity() {
 private val channelId="allways_urgent_v2"
 private val updaterChannel="com.allways.carrier/apk_installer"
 private val installAction="com.allways.carrier.PACKAGE_INSTALL_STATUS"
 override fun onCreate(savedInstanceState: Bundle?){super.onCreate(savedInstanceState);createChannel()}
 override fun configureFlutterEngine(flutterEngine: FlutterEngine){
  super.configureFlutterEngine(flutterEngine)
  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,"allways_notifications").setMethodCallHandler{call,result->if(call.method=="showNotification"){showNotification(call.argument<String>("title")?:"ALLways",call.argument<String>("body")?:"");result.success(null)}else result.notImplemented()}
  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,updaterChannel).setMethodCallHandler{call,result->when(call.method){
   "installApk"->installApk(call.argument<String>("path"),result)
   "openInstallSettings"->{if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O)startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:$packageName")))else startActivity(Intent(Settings.ACTION_SECURITY_SETTINGS));result.success("opened")}
   else->result.notImplemented()
  }}
 }
 private fun createChannel(){if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O)getSystemService(NotificationManager::class.java).createNotificationChannel(NotificationChannel(channelId,"ALLways Ride Alerts",NotificationManager.IMPORTANCE_HIGH).apply{enableVibration(true);vibrationPattern=longArrayOf(0,450,180,450,180,700)})}
 private fun showNotification(title:String,body:String){createChannel();val launch=packageManager.getLaunchIntentForPackage(packageName)?.apply{flags=Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP};val pending=launch?.let{PendingIntent.getActivity(this,(System.currentTimeMillis() and 0x7fffffff).toInt(),it,PendingIntent.FLAG_UPDATE_CURRENT or if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.M)PendingIntent.FLAG_IMMUTABLE else 0)};val n=NotificationCompat.Builder(this,channelId).setSmallIcon(android.R.drawable.ic_dialog_alert).setContentTitle(title).setContentText(body).setPriority(NotificationCompat.PRIORITY_MAX).setAutoCancel(true).setContentIntent(pending).build();(getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify((System.currentTimeMillis() and 0x7fffffff).toInt(),n)}
 private fun installApk(path:String?,result:MethodChannel.Result){if(path.isNullOrBlank()){result.error("NO_APK","APK path is missing",null);return};try{if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.O&&!packageManager.canRequestPackageInstalls()){startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:$packageName")));result.success("permission_required");return};val apk=File(path);if(!apk.exists()||apk.length()<=0L){result.error("NO_APK","Downloaded APK is missing",null);return};val params=PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL);params.setAppPackageName(packageName);val id=packageManager.packageInstaller.createSession(params);val session=packageManager.packageInstaller.openSession(id);try{session.openWrite("package",0,apk.length()).use{out->FileInputStream(apk).use{input->input.copyTo(out,1024*1024)};session.fsync(out)};val intent=Intent(this,InstallStatusReceiver::class.java).apply{action=installAction;putExtra("sessionId",id)};val flags=PendingIntent.FLAG_UPDATE_CURRENT or if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.S)PendingIntent.FLAG_MUTABLE else 0;session.commit(PendingIntent.getBroadcast(this,id,intent,flags).intentSender);result.success("started")}finally{session.close()}}catch(e:Exception){result.error("INSTALL_FAILED",e.message?:"Package installation failed",null)}}
 class InstallStatusReceiver:BroadcastReceiver(){override fun onReceive(context:Context,intent:Intent){if(intent.getIntExtra(PackageInstaller.EXTRA_STATUS,PackageInstaller.STATUS_FAILURE)==PackageInstaller.STATUS_PENDING_USER_ACTION){val confirm=if(Build.VERSION.SDK_INT>=Build.VERSION_CODES.TIRAMISU)intent.getParcelableExtra(Intent.EXTRA_INTENT,Intent::class.java)else{@Suppress("DEPRECATION") intent.getParcelableExtra(Intent.EXTRA_INTENT)};confirm?.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);if(confirm!=null)context.startActivity(confirm)}}}
}
KOTLIN
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/allways-release.jks
          test -s android/app/allways-release.jks
          KEY_ALIAS="$(keytool -list -v -keystore android/app/allways-release.jks -storepass "$STORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test "$KEY_ALIAS" = "allways"
          cat > android/key.properties <<EOF
          storeFile=app/allways-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Validate Mapbox public token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN"
          case "$MAPBOX_PUBLIC_TOKEN" in pk.*) echo "Mapbox public token configured." ;; *) echo "MAPBOX_PUBLIC_TOKEN must start with pk."; exit 1 ;; esac

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: allways-carrier-partner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14


      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-carrier-v${APP_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-carrier-latest.apk"
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: allways-latest
          name: "ALLways ALLways Ride Alerts v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: |
            release-assets/allways-carrier-v${{ env.APP_VERSION }}.apk
            release-assets/allways-carrier-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Android runtime smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            timeout 90s adb shell am start -S -W -n com.allways.carrier/.MainActivity
            adb shell pidof com.allways.carrier
