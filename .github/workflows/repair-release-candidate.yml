name: ALLways Driver Partner Repair Release Candidate
on:
  push:
    branches: [fix/reported-flow-audit-2026-10-10]
    paths:
      - "lib/**"
      - "tool/**"
      - "pubspec.yaml"
      - ".github/workflows/repair-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android
        shell: bash
        run: |
          flutter create --platforms=android --org com.allways --project-name carrier .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          if 'id("com.google.gms.google-services") version "4.5.0" apply false' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false',
                  1,
              )
          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
          prefix = """import java.util.Properties

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
          }

          """
          if "val keystorePropertiesFile = rootProject.file" not in s:
              s = prefix + s
          signing = """    signingConfigs {
              if (keystorePropertiesFile.exists()) {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          }

          """
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {" + chr(10) + signing, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")')
          s = s.replace('namespace = "com.example.carrier"', 'namespace = "com.allways.carrier"')
          s = s.replace('applicationId = "com.example.carrier"', 'applicationId = "com.allways.carrier"')
          if 'namespace = "com.allways.carrier"' not in s:
              s = s.replace("android {", 'android {\n    namespace = "com.allways.carrier"', 1)
          s = s.replace('namespace = "com.example.carrier"', 'namespace = "com.allways.carrier"')
          s = s.replace('applicationId = "com.example.carrier"', 'applicationId = "com.allways.carrier"')
          if 'applicationId = "com.allways.carrier"' not in s:
              s = s.replace('applicationId = ""', 'applicationId = "com.allways.carrier"', 1)
          p.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest.parent.mkdir(parents=True, exist_ok=True)
          manifest.write_text("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
            <application android:label="ALLways Driver Partner" android:icon="@mipmap/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="allways_urgent_v4"/>
              <meta-data android:name="flutterEmbedding" android:value="2"/>
            </application>
          </manifest>
          """)
          icon = Path("android/app/src/main/res/drawable/allways_driver_partner_icon.xml")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#087F8C" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/><path android:fillColor="#FFFFFF" android:pathData="M54,24A30,30 0,1 0,54 84A30,30 0,1 0,54 24M54,32A22,22 0,1 1,54 76A22,22 0,1 1,54 32"/><path android:fillColor="#FFFFFF" android:pathData="M30,43L50,51L45,58L28,53Z"/><path android:fillColor="#FFFFFF" android:pathData="M78,43L58,51L63,58L80,53Z"/><path android:fillColor="#FFFFFF" android:pathData="M51,50H57V74H51Z"/><path android:fillColor="#FFFFFF" android:pathData="M47,69H61V75H47Z"/></vector>
          """)
          manifest.write_text(manifest.read_text().replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/allways_driver_partner_icon"'))
          PY

          cat > android/app/src/main/kotlin/com/allways/carrier/MainActivity.kt <<'KOTLIN'
          package com.allways.carrier

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.Bundle
          import androidx.core.app.NotificationCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelId = "allways_urgent_v4"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  createChannel()
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "allways_notifications")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "showNotification") {
                              showNotification(call.argument<String>("title") ?: "ALLways", call.argument<String>("body") ?: "")
                              result.success(null)
                          } else result.notImplemented()
                      }
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val sound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      val audio = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build()
                      val channel = NotificationChannel(channelId, "ALLways Urgent Alerts", NotificationManager.IMPORTANCE_HIGH).apply {
                          description = "Ride and delivery requests that need immediate attention"
                          setSound(sound, audio)
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 450, 180, 450, 180, 700)
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun showNotification(title: String, body: String) {
                  createChannel()
                  val launch = packageManager.getLaunchIntentForPackage(packageName)?.apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pending = launch?.let {
                      PendingIntent.getActivity(
                          this, (System.currentTimeMillis() and 0x7fffffff).toInt(), it,
                          PendingIntent.FLAG_UPDATE_CURRENT or if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0
                      )
                  }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_alert)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setAutoCancel(true)
                      .setContentIntent(pending)
                      .build()
                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                      .notify((System.currentTimeMillis() and 0x7fffffff).toInt(), notification)
              }
          }
          KOTLIN

      - name: Configure native in-app updater
        run: python3 tool/configure_android_updater.py

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/allways-release.jks
          test -s android/app/allways-release.jks
          KEY_ALIAS="$(keytool -list -v -keystore android/app/allways-release.jks -storepass "$STORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test "$KEY_ALIAS" = "allways"
          cat > android/key.properties <<EOF
          storeFile=app/allways-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Validate Mapbox public token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN"
          case "$MAPBOX_PUBLIC_TOKEN" in pk.*) echo "Mapbox public token configured." ;; *) echo "MAPBOX_PUBLIC_TOKEN must start with pk."; exit 1 ;; esac

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Enforce 30 MB release APK limit
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Release APK size: $SIZE bytes"
          if [ "$SIZE" -gt 30000000 ]; then
            echo "Release APK exceeds the 30,000,000-byte limit; refusing to publish."
            exit 1
          fi


      - name: Verify final app identity
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "package: name='com.allways.carrier'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "application-label:'ALLways Driver Partner'"

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build x86_64 smoke-test APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        shell: bash
        run: flutter build apk --debug --target-platform android-x64 --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            adb logcat -c
            adb install -r build/app/outputs/flutter-apk/app-debug.apk || (sleep 5 && adb install -r build/app/outputs/flutter-apk/app-debug.apk)
            timeout 90s adb shell am start -W -n com.allways.carrier/.MainActivity
            sleep 15
            adb shell pidof com.allways.carrier >/dev/null || { echo "Driver Partner process exited after launch; Android diagnostics follow."; adb logcat -d -t 1200 | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.allways.carrier|Unable to start activity' || true; adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true; exit 1; }

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-driver-partner-v${{ env.APP_VERSION }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-driver-partner-latest.apk"

      - name: Upload signed release candidate (no GitHub Release publication)
        uses: actions/upload-artifact@v4
        with:
          name: allways-driver-partner-release-candidate
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7
