name: ALLways Driver Partner QA Build

on:
  push:
    branches: [audit-implementation-2026-10, fix/fcm-registration-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allways-driver-partner-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-build:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout approved feature branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Diagnose self-hosted Android build tools
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME ($env:RUNNER_OS / $env:RUNNER_ARCH)"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-Command flutter -ErrorAction Stop | Format-List Source
          java -version
          if ($env:ANDROID_HOME) { Write-Host "ANDROID_HOME=$env:ANDROID_HOME" }
          elseif ($env:ANDROID_SDK_ROOT) { Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" }
          else { Write-Host "Android SDK variables are not set; build step will confirm availability." }

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Generate Android project scaffolding for QA build
        run: flutter create --platforms=android --org com.allways --project-name driver_partner .

      - name: Build QA debug APK (no release signing)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Check APK exists and report size
        shell: pwsh
        run: |
          $apk = Join-Path $env:GITHUB_WORKSPACE "build/app/outputs/flutter-apk/app-debug.apk"
          if (-not (Test-Path $apk)) { throw "Expected QA APK was not created: $apk" }
          $item = Get-Item $apk
          if ($item.Length -le 0) { throw "QA APK exists but is empty." }
          Write-Host ("APK size: {0:N2} MB ({1} bytes)" -f ($item.Length / 1MB), $item.Length)
          Get-FileHash -Path $apk -Algorithm SHA256

      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: allways-driver-partner-qa-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
