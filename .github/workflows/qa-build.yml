name: ALLways Driver Partner QA Build

on:
  push:
    branches: [audit-implementation-2026-10, fix/fcm-registration-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allways-driver-partner-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout approved feature branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project scaffolding for QA build
        run: flutter create --platforms=android --org com.allways --project-name carrier .

      - name: Bound Gradle memory for hosted runner
        shell: bash
        run: |
          if grep -q '^org.gradle.jvmargs=' android/gradle.properties; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError|' android/gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError' >> android/gradle.properties
          fi
          grep -q '^org.gradle.workers.max=' android/gradle.properties || echo 'org.gradle.workers.max=2' >> android/gradle.properties
          grep -q '^org.gradle.parallel=' android/gradle.properties || echo 'org.gradle.parallel=false' >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build QA debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Validate APK and report size
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          size=$(stat -c%s "$apk")
          echo "QA APK size: $((size / 1024 / 1024)) MiB ($size bytes)"
          sha256sum "$apk"

      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: allways-driver-partner-qa-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
